apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rancher2-oidc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rancher2-oidc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.pod.replicas }}
  selector:
    matchLabels:
      {{- include "rancher2-oidc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rancher2-oidc.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rancher2-oidc.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.pod.securityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - aggregator
            - --base-url={{ .Values.baseURL }}
            - --port={{ .Values.port }}
            - --cache-ttl={{ .Values.cacheTTL }}
           {{- if .Values.debug }}
            - --debug
            {{- end }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.pod.resources | nindent 12 }}
      {{- with .Values.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
