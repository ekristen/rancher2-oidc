apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oidc-aggregator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oidc-aggregator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oidc-aggregator.fullname" . }}
  labels:
    {{- include "oidc-aggregator.labels" . | nindent 4 }}
rules:
  # Access to Rancher cluster resources to discover downstream clusters
  - apiGroups: ["provisioning.cattle.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  # Access to secrets for reading kubeconfigs and managing OIDC cache
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Access to namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oidc-aggregator.fullname" . }}
  labels:
    {{- include "oidc-aggregator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oidc-aggregator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oidc-aggregator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
