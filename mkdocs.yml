site_name: Rancher OIDC Aggregator
site_url: https://ekristen.github.io/rancher-oidc-aggregator-ng
repo_name: ekristen/rancher-oidc-aggregator-ng
repo_url: https://github.com/ekristen/rancher-oidc-aggregator-ng
edit_uri: ""

site_dir: public

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - Components:
      - Aggregator Service: components/aggregator.md
      - Agent: components/agent.md
  - Deployment:
      - Helm Chart: deployment/helm.md
      - Fleet Bundle: deployment/fleet.md
  - Security:
      - Authentication: security/authentication.md
      - TLS: security/tls.md
  - API:
      - Endpoints: api/endpoints.md
      - OIDC: api/oidc.md
  - Reference:
      - Command Line: reference/cli.md
      - Configuration: reference/configuration.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: en
